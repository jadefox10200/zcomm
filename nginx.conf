user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name zcommapp.com www.zcommapp.com;

        return 301 https://$server_name$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name zcommapp.com www.zcommapp.com;

        ssl_certificate     /etc/letsencrypt/live/zcommapp.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zcommapp.com/privkey.pem;

        # Recommended basic SSL settings
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Serve static files (images, icons, json, etc.) directly if they exist
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|js|css|json|woff|woff2|ttf|eot|pdf)$ {
            root /usr/share/nginx/html;
            expires 30d;
            access_log off;
            try_files $uri =404;  # Serve if exists, else real 404 (no fallback)
        }

        # SPA fallback for client-side routes (only for paths without extension)
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        # Proxy API to Go backend
        location /api/ {
            proxy_pass http://backend:8080/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}