user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Redirect all HTTP traffic to HTTPS, but allow ACME challenge for cert renewal
    server {
        listen 80;
        listen [::]:80;
        server_name zcommapp.com www.zcommapp.com;

        # Let certbot serve its challenge files for webroot renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Main HTTPS server
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name zcommapp.com www.zcommapp.com;

        ssl_certificate     /etc/letsencrypt/live/zcommapp.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zcommapp.com/privkey.pem;

        # Recommended SSL settings
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 4h;

        # HTTP Strict Transport Security (HSTS)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 1. Serve manifest.json directly (PWA support)
        location = /manifest.json {
            root /usr/share/nginx/html;
            access_log off;
            try_files $uri =404;
        }

        # 2. Serve manifest-pwa.json directly (PWA support)
        location = /manifest-pwa.json {
            root /usr/share/nginx/html;
            access_log off;
            try_files $uri =404;
        }

        # 3. Serve service-worker.js directly (PWA support)
        location = /service-worker.js {
            root /usr/share/nginx/html;
            access_log off;
            try_files $uri =404;
        }

        # 4. Serve favicon and icons
        location ~* ^/(favicon\.ico|.*\.png|.*\.svg|apple-touch-icon.*\.png)$ {
            root /usr/share/nginx/html;
            expires 30d;
            access_log off;
            try_files $uri =404;
        }

        # Health check endpoint - publicly accessible
        location = /health {
            proxy_pass http://zcomm-backend:8080/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;  # Optional: reduce logs for health checks
        }

        # 5. Serve static assets from /static/ directory
        location /static/ {
            root /usr/share/nginx/html;
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 6. Serve other static files (CSS, JS, fonts, etc.)
        location ~* \.(js|css|json|woff|woff2|ttf|eot|pdf|txt|map)$ {
            # Essential proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # HTTP/1.1 for better compatibility
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Disable buffering for API responses
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # 7. SPA fallback only for non-file routes
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html =404;
        }
    }
}