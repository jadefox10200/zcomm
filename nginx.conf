user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # HTTP → HTTPS redirect
    # server {
    #     listen 80;
    #     listen [::]:80;
    #     server_name zcommapp.com www.zcommapp.com;

    #     # return 301 https://$server_name$request_uri;
    # }

    # HTTPS server
    server {
        listen 80;
        listen [::]:80;
        server_name zcommapp.com www.zcommapp.com;

        ssl_certificate     /etc/letsencrypt/live/zcommapp.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zcommapp.com/privkey.pem;

        # Recommended basic SSL settings
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # 1. Serve manifest.json directly (PWA support)
        location = /manifest.json {
            root /usr/share/nginx/html;
            access_log off;
            try_files $uri =404;
        }

        # 2. Serve service-worker.js directly (PWA support)
        location = /service-worker.js {
            root /usr/share/nginx/html;
            access_log off;
            try_files $uri =404;
        }

        # 3. Serve static files (images, icons, assets, source maps, etc.) directly — highest priority
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|js|css|json|woff|woff2|ttf|eot|pdf|txt|map)$ {
            root /usr/share/nginx/html;
            expires 30d;
            access_log off;
            try_files $uri =404;   # Serve file if exists, else real 404 — NO fallback to index.html
        }

        # Proxy API to Go backend
        location /api/ {
            proxy_pass http://zcomm-backend:8080/;

            # Essential proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # Preserve original request headers
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Accept $http_accept;

            # CORS headers (pass through from backend)
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;

            # HTTP/1.1 for better compatibility
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Enable buffering for JSON responses
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
        
        # 4. SPA fallback only for non-file routes
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html =404;
        }
    }
}