version: "3.9"
services:
  backend:
    build: ./backend
    container_name: zcomm-backend
    restart: always
    volumes:
      - ./backend/data:/app/data
      - ./backend/attachments:/app/attachments
    environment:
      - API_ENV=production
      - ATTACHMENT_DIR=/app/attachments
    ports:
      - "8080:8080"

  nginx:
    image: nginx:alpine
    container_name: zcomm-nginx
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/build:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

  certbot:
    image: certbot/certbot
    container_name: zcomm-certbot
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Attempt renewal every 12 hours; certbot skips if the cert is still fresh
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done"

volumes:
  # Shared webroot volume used by Nginx and certbot for ACME domain-verification challenge files
  certbot-webroot:
