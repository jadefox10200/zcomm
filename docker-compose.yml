version: "3.9"
services:
  backend:
    build: ./backend
    container_name: zcomm-backend
    restart: always
    volumes:
      - ./backend/data:/app/data
      - /etc/letsencrypt/live/zcommapp.com/fullchain.pem:/app/server.crt:ro
      - /etc/letsencrypt/live/zcommapp.com/privkey.pem:/app/server.key:ro
    environment:
      - API_ENV=production
    ports:
      - "8080:8080" # or use 8443 with HTTPS (see instructions)

  nginx:
    image: nginx:alpine
    container_name: zcomm-nginx
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/build:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
